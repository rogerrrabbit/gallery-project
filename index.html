<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objets Trouvés - Galerie Vintage</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
</head>

<body class="loading">
    <!-- Header -->
    <header>
        <button id="back-button" class="header-btn back-button" aria-label="Revenir">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
            <span>Revenir</span>
        </button>
        <h1></h1>
        <p></p>
        <div class="city-menu-wrapper">
            <button class="city-menu-arrow city-menu-arrow-left" aria-label="Scroll left">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
            <div id="city-menu" class="city-menu"></div>
            <button class="city-menu-arrow city-menu-arrow-right" aria-label="Scroll right">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </button>
        </div>
        <button id="view-toggle" class="header-btn view-toggle" aria-label="Toggle View">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <line x1="9" y1="3" x2="9" y2="21" />
            </svg>
        </button>
        <button id="scroll-top" class="header-btn scroll-top" aria-label="Scroll to Top">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
        </button>
    </header>

    <!-- Gallery Grid -->
    <main class="gallery" id="gallery">
        <!-- Map Container -->
        <div class="map-tile" id="map-container">
            <div id="map"></div>
        </div>
        <!-- Gallery items will be dynamically inserted here -->
    </main>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <button class="modal-nav prev" id="modal-prev" aria-label="Previous image">&lt;</button>
            <button class="modal-nav next" id="modal-next" aria-label="Next image">&gt;</button>
            <div class="modal-inner">
                <div class="modal-image">
                    <img id="modal-img" src="" alt="">
                </div>
                <div class="modal-info">
                    <h2 id="modal-title"></h2>
                    <p id="modal-meta" class="modal-meta"></p>
                    <p id="modal-description" class="modal-description"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="script.js"></script>
</body>

</html>
